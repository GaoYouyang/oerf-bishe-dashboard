<!doctype html>
<html lang="zh-CN" data-title-zh="未公开资产 | OERF 证据边界" data-title-en="Unpublished Asset | OERF Evidence Boundary">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>未公开资产 | OERF 证据边界</title>
  <meta
    name="description"
    content="说明 OERF 历史页面中未随 GitHub Pages 发布的实现、配置和大型证据资产。"
    data-content-zh="说明 OERF 历史页面中未随 GitHub Pages 发布的实现、配置和大型证据资产。"
    data-content-en="Explains implementation, configuration, and large evidence assets referenced by historical OERF pages but intentionally omitted from GitHub Pages."
  />
  <link rel="stylesheet" href="assets/site-language.css" />
  <style>
    :root {
      --ink: #17252b;
      --muted: #5c6d74;
      --line: #cad6d2;
      --bg: #f3f6f4;
      --paper: #ffffff;
      --teal: #146f66;
      --blue: #315f93;
      --gold: #8a651b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.68;
      letter-spacing: 0;
    }
    header, main, footer {
      width: min(880px, calc(100vw - 36px));
      margin: 0 auto;
    }
    header {
      padding: 22px 0 24px;
      border-bottom: 1px solid var(--line);
    }
    main { padding: 42px 0 58px; }
    footer {
      padding: 22px 0 36px;
      color: var(--muted);
      font-size: 13px;
    }
    h1 {
      margin: 12px 0 10px;
      font-size: clamp(31px, 6vw, 50px);
      line-height: 1.16;
      letter-spacing: 0;
    }
    p { margin: 9px 0; }
    a { color: var(--blue); }
    .eyebrow {
      color: var(--teal);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .lead {
      max-width: 760px;
      color: #405159;
      font-size: 18px;
    }
    .notice {
      margin-top: 26px;
      padding: 20px 22px;
      border: 1px solid #d9c187;
      border-left: 5px solid var(--gold);
      border-radius: 7px;
      background: var(--paper);
    }
    .asset-label {
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    code {
      display: block;
      margin-top: 6px;
      padding: 11px 12px;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #eef3f1;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 24px;
    }
    .button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: var(--paper);
      text-decoration: none;
      font-weight: 760;
    }
    .button.primary {
      color: #fff;
      border-color: var(--teal);
      background: var(--teal);
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" data-i18n-zh="返回主页" data-i18n-en="Back to home">返回主页</a>
  </header>
  <main>
    <p class="eyebrow" data-i18n-zh="公开证据边界" data-i18n-en="PUBLIC EVIDENCE BOUNDARY">公开证据边界</p>
    <h1 data-i18n-zh="这个资产没有公开" data-i18n-en="This asset is not public">这个资产没有公开</h1>
    <p
      class="lead"
      data-i18n-zh="历史页面保留了这项工作的名称，但对应实现、配置、受限格式或大型中间证据不随 GitHub Pages 发布。"
      data-i18n-en="The historical page preserves the name of this work, while its implementation, configuration, restricted format, or large intermediate evidence is intentionally omitted from GitHub Pages."
    >历史页面保留了这项工作的名称，但对应实现、配置、受限格式或大型中间证据不随 GitHub Pages 发布。</p>

    <section class="notice" aria-labelledby="boundary-title">
      <h2 id="boundary-title" data-i18n-zh="这不改变科学结论" data-i18n-en="This does not change the scientific conclusion">这不改变科学结论</h2>
      <p
        data-i18n-zh="公开摘要、图表和结论边界仍可在研究进程页阅读。这个提示只用于避免把未发布资产伪装成可下载文件。"
        data-i18n-en="Public summaries, figures, and claim boundaries remain available on the research-progress page. This notice prevents an unpublished asset from being presented as a working download."
      >公开摘要、图表和结论边界仍可在研究进程页阅读。这个提示只用于避免把未发布资产伪装成可下载文件。</p>
    </section>

    <p class="asset-label" data-i18n-zh="原页面引用" data-i18n-en="Original page reference">原页面引用</p>
    <code id="asset-reference">未提供 / Not provided</code>

    <div class="actions">
      <a class="button primary" href="operator-learning/index.html" data-i18n-zh="查看当前研究进程" data-i18n-en="View current research progress">查看当前研究进程</a>
      <a class="button" href="javascript:history.back()" data-i18n-zh="返回上一页" data-i18n-en="Go back">返回上一页</a>
    </div>
  </main>
  <footer data-i18n-zh="OERF 三维 BOST C 路线 · 公开层只保留去隐私证据" data-i18n-en="OERF 3D BOST C route · The public layer contains privacy-safe evidence only">
    OERF 三维 BOST C 路线 · 公开层只保留去隐私证据
  </footer>
  <script>
    (() => {
      const value = new URLSearchParams(window.location.search).get('asset');
      if (value) document.getElementById('asset-reference').textContent = value;
    })();
  </script>
  <script src="assets/site-language.js" defer></script>
</body>
</html>
