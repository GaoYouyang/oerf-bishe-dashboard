<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">v112.1 projected-ridge parent-control screen</title>
  <desc id="desc">Observation p90 ratios relative to Zero-K4 for rank-4 and rank-32 projected-ridge controls across five PoolFire trajectories. All values exceed the 1.01 harm gate.</desc>
  <rect width="1200" height="720" fill="#f5f7f6"/>
  <rect x="48" y="42" width="1104" height="632" rx="8" fill="#ffffff" stroke="#cad3d0"/>
  <text x="86" y="92" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17211f">v112.1 父控制筛查 / Parent-control screen</text>
  <text x="86" y="122" font-family="Arial, sans-serif" font-size="16" fill="#54635f">Observation p90 ratio vs Zero-K4 · lower is better · gate = 1.01</text>

  <rect x="835" y="70" width="14" height="14" fill="#167d78"/><text x="857" y="83" font-family="Arial, sans-serif" font-size="14" fill="#33413e">rank 4</text>
  <rect x="930" y="70" width="14" height="14" fill="#d56b4f"/><text x="952" y="83" font-family="Arial, sans-serif" font-size="14" fill="#33413e">rank 32</text>

  <line x1="110" y1="500" x2="805" y2="500" stroke="#82908c" stroke-width="1.5"/>
  <line x1="110" y1="140" x2="110" y2="500" stroke="#82908c" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#5b6965">
    <line x1="104" y1="500" x2="805" y2="500" stroke="#e0e5e3"/><text x="70" y="505">1.0</text>
    <line x1="104" y1="420" x2="805" y2="420" stroke="#e0e5e3"/><text x="70" y="425">1.2</text>
    <line x1="104" y1="340" x2="805" y2="340" stroke="#e0e5e3"/><text x="70" y="345">1.4</text>
    <line x1="104" y1="260" x2="805" y2="260" stroke="#e0e5e3"/><text x="70" y="265">1.6</text>
    <line x1="104" y1="180" x2="805" y2="180" stroke="#e0e5e3"/><text x="70" y="185">1.8</text>
  </g>
  <line x1="110" y1="496" x2="805" y2="496" stroke="#b5332e" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="690" y="487" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9d2c28">harm gate 1.01</text>

  <g font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <rect x="149" y="418" width="32" height="82" fill="#167d78"/><text x="165" y="410" fill="#167d78">1.205</text>
    <rect x="185" y="466" width="32" height="34" fill="#d56b4f"/><text x="201" y="458" fill="#b9543b">1.085</text>
    <text x="183" y="526" font-size="14" fill="#33413e">P14</text>

    <rect x="279" y="431" width="32" height="69" fill="#167d78"/><text x="295" y="423" fill="#167d78">1.173</text>
    <rect x="315" y="484" width="32" height="16" fill="#d56b4f"/><text x="331" y="476" fill="#b9543b">1.039</text>
    <text x="313" y="526" font-size="14" fill="#33413e">P22</text>

    <rect x="409" y="218" width="32" height="282" fill="#167d78"/><text x="425" y="210" fill="#167d78">1.704</text>
    <rect x="445" y="339" width="32" height="161" fill="#d56b4f"/><text x="461" y="331" fill="#b9543b">1.403</text>
    <text x="443" y="526" font-size="14" fill="#33413e">P33</text>

    <rect x="539" y="149" width="32" height="351" fill="#167d78"/><text x="555" y="141" fill="#167d78">1.878</text>
    <rect x="575" y="308" width="32" height="192" fill="#d56b4f"/><text x="591" y="300" fill="#b9543b">1.479</text>
    <text x="573" y="526" font-size="14" fill="#33413e">P45</text>

    <rect x="669" y="342" width="32" height="158" fill="#167d78"/><text x="685" y="334" fill="#167d78">1.396</text>
    <rect x="705" y="412" width="32" height="88" fill="#d56b4f"/><text x="721" y="404" fill="#b9543b">1.219</text>
    <text x="703" y="526" font-size="14" fill="#33413e">P58</text>
  </g>

  <rect x="842" y="151" width="262" height="116" rx="6" fill="#eef7f5" stroke="#96c8c3"/>
  <text x="864" y="181" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#155f5b">rank 4 exact-call budget</text>
  <text x="864" y="218" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#167d78">38 vs 44</text>
  <text x="864" y="245" font-family="Arial, sans-serif" font-size="14" fill="#465551">cheaper, but 0/5 trajectory gates</text>

  <rect x="842" y="285" width="262" height="116" rx="6" fill="#fff3ee" stroke="#e2af9f"/>
  <text x="864" y="315" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9b4937">rank 32 exact-call budget</text>
  <text x="864" y="352" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#c25d44">66 vs 44</text>
  <text x="864" y="379" font-family="Arial, sans-serif" font-size="14" fill="#5f4b45">more expensive and 0/5 gates</text>

  <rect x="842" y="419" width="262" height="116" rx="6" fill="#f4f1fb" stroke="#bcb1d5"/>
  <text x="864" y="449" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#554477">Independent replay</text>
  <text x="864" y="486" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#554477">max diff 6.67e-16</text>
  <text x="864" y="513" font-family="Arial, sans-serif" font-size="14" fill="#554d64">90 truth mutations · 180 contexts stable</text>

  <rect x="86" y="568" width="1018" height="70" rx="6" fill="#edf1ef"/>
  <text x="108" y="596" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#25332f">结论 / Verdict</text>
  <text x="108" y="621" font-family="Arial, sans-serif" font-size="15" fill="#40504b">Simple projected-ridge parents do not reject the learned advantage. Full parent contract remains open.</text>
  <text x="930" y="621" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#9d2c28">algorithm_breakthrough=false</text>
</svg>
