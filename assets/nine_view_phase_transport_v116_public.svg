<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">v116 global phase-transport diagnostic</title>
  <desc id="desc">Across 900 deployment-only adjacent BP pairs, zero had a nonzero global integer shift and zero improved coherence beyond numerical tolerance.</desc>
  <rect width="960" height="430" fill="#f5f8f7"/>
  <text x="58" y="62" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#173b37">v116 | Global phase transport closes at the input gate</text>
  <text x="58" y="94" font-family="Arial, sans-serif" font-size="16" fill="#526966">Deployment-only adjacent cheap factor-BP; no truth or scorer loaded</text>
  <line x1="90" y1="330" x2="890" y2="330" stroke="#9cafaa" stroke-width="2"/>
  <rect x="210" y="322" width="180" height="8" fill="#d85d58"/>
  <rect x="570" y="322" width="180" height="8" fill="#d85d58"/>
  <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#bb3e3a">0 / 900</text>
  <text x="300" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334b47">nonzero global integer shifts</text>
  <text x="660" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#bb3e3a">0 / 900</text>
  <text x="660" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334b47">coherence gains above 1e-12</text>
  <text x="480" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#657b77">Independent replay: maximum shift and coherence differences both 0</text>
</svg>
