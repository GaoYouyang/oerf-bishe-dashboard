<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">v112.4 temporal CNN parent-control decision</title>
  <desc id="desc">Three same-seed parent-control comparisons. Seed 1103 is not rejected; seeds 2203 and 3301 fail the frozen p90 or worst-tail gate.</desc>
  <rect width="960" height="440" fill="#f7fbfa"/>
  <text x="54" y="58" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#18322e">v112.4 temporal CNN parent control</text>
  <text x="54" y="87" font-family="Arial, sans-serif" font-size="16" fill="#49635e">Equal online budget: 2A + 2A^T. Two of three same-seed comparisons reject the current learned-advantage claim.</text>
  <line x1="116" y1="330" x2="886" y2="330" stroke="#18322e" stroke-width="2"/>
  <line x1="116" y1="170" x2="886" y2="170" stroke="#c94f45" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="120" y="158" font-family="Arial, sans-serif" font-size="15" fill="#a43d36">Tail gate: candidate minus control must be <= 0</text>
  <g font-family="Arial, sans-serif">
    <text x="225" y="367" font-size="18" text-anchor="middle" fill="#18322e">seed 1103</text>
    <rect x="181" y="330" width="88" height="8" fill="#1f8a70"/>
    <text x="225" y="314" font-size="17" text-anchor="middle" fill="#1f6b59">-0.00136</text>
    <text x="225" y="397" font-size="16" text-anchor="middle" fill="#1f6b59">not rejected</text>
    <text x="500" y="367" font-size="18" text-anchor="middle" fill="#18322e">seed 2203</text>
    <rect x="456" y="170" width="88" height="160" fill="#c94f45"/>
    <text x="500" y="155" font-size="17" text-anchor="middle" fill="#a43d36">+0.02766</text>
    <text x="500" y="397" font-size="16" text-anchor="middle" fill="#a43d36">rejected</text>
    <text x="775" y="367" font-size="18" text-anchor="middle" fill="#18322e">seed 3301</text>
    <rect x="731" y="264" width="88" height="66" fill="#c94f45"/>
    <text x="775" y="249" font-size="17" text-anchor="middle" fill="#a43d36">+0.01145</text>
    <text x="775" y="397" font-size="16" text-anchor="middle" fill="#a43d36">rejected</text>
  </g>
  <text x="54" y="426" font-family="Arial, sans-serif" font-size="14" fill="#49635e">Independent replay: 270 predictions, 2970 candidate cells, 2970 control cells; maximum numerical difference = 0.</text>
</svg>
